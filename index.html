<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#650909">
<title>IMLEK 2027 — GENK</title>

<style>
*{box-sizing:border-box}

:root{
  --gold:#ffdc83;
  --bright:#fff0bd;
  --red:#8e0909;
}

html{min-height:100%;}

body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  color:var(--bright);
  font-family:Georgia,'Times New Roman',serif;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow-x:hidden;
  position:relative;
  background:
    radial-gradient(ellipse at 50% 35%,
      #861b13 0%,#500606 48%,#160202 100%);
}

/* Latar kelenteng megah */
.temple-bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 65%,
      #d38a241c 0%,transparent 45%),
    linear-gradient(180deg,
      #180303 0%,#570707 38%,#290303 100%);
}

.temple-bg svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* Cahaya emas di tengah */
.temple-bg:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at center,
      #28020235 0%,#18010150 55%,#1000009c 100%),
    linear-gradient(90deg,
      #16010155,transparent 25%,transparent 75%,#16010155);
}

/* Naga dekorasi */
.dragon{
  position:fixed;
  z-index:1;
  top:15%;
  font-size:clamp(65px,10vw,125px);
  filter:drop-shadow(0 0 16px #ffb52e66);
  opacity:.82;
  pointer-events:none;
  animation:dragonFloat 5s ease-in-out infinite;
}
.dragon-left{
  left:1%;
  transform:rotate(-20deg);
}
.dragon-right{
  right:1%;
  transform:scaleX(-1) rotate(-20deg);
  animation-delay:2.5s;
}

@keyframes dragonFloat{
  0%,100%{margin-top:0}
  50%{margin-top:12px}
}

/* Lampion */
.lantern{
  position:fixed;
  z-index:1;
  top:0;
  font-size:clamp(34px,5vw,62px);
  filter:drop-shadow(0 0 15px #ffad32);
  transform-origin:top center;
  animation:swing 3s ease-in-out infinite;
  pointer-events:none;
}
.lantern:before{
  content:"";
  position:absolute;
  height:65px;
  width:2px;
  background:linear-gradient(#e6b45c,#8c4c12);
  bottom:88%;
  left:50%;
}
.lantern-one{left:9%}
.lantern-two{right:9%;animation-delay:1.5s}

@keyframes swing{
  0%,100%{transform:rotate(-5deg)}
  50%{transform:rotate(5deg)}
}

/* Barongsai */
.lion{
  position:fixed;
  z-index:1;
  bottom:1%;
  font-size:clamp(75px,13vw,155px);
  filter:drop-shadow(0 0 18px #ffad28);
  pointer-events:none;
  animation:lionDance 2.4s ease-in-out infinite;
}
.lion-left{left:0}
.lion-right{right:0;animation-delay:1.2s}

@keyframes lionDance{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-12px) rotate(4deg)}
}

/* Ornamen emas */
.corner{
  position:fixed;
  width:180px;
  height:180px;
  border:1px solid #edc36b55;
  border-radius:50%;
  box-shadow:
    0 0 0 15px #edc36b0d,
    0 0 0 32px #edc36b09,
    inset 0 0 35px #edc36b12;
  pointer-events:none;
  z-index:1;
}
.corner-a{top:-100px;left:-90px}
.corner-b{bottom:-110px;right:-80px}

/* Konten countdown */
.page{
  width:min(790px,94%);
  padding:24px 16px;
  position:relative;
  z-index:2;
  margin:auto;
  background:
    linear-gradient(145deg,#320303a8,#1b0101c9);
  border:1px solid #e8bd634d;
  border-radius:24px;
  box-shadow:
    0 0 45px #00000080,
    0 0 80px #f4a62313,
    inset 0 0 35px #ffcb4b08;
  backdrop-filter:blur(5px);
}

.top{
  font-size:clamp(12px,2vw,16px);
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 0 15px #ffcb5570;
}

.gold{color:#ffd778}

.lanterns{
  font-size:clamp(32px,6vw,55px);
  margin:9px 0;
  filter:drop-shadow(0 0 12px #ffad2e);
}

h1{
  font-size:clamp(35px,7vw,68px);
  line-height:1.03;
  margin:8px 0;
  color:#ffe4a0;
  text-shadow:
    0 2px 0 #8e4a10,
    0 0 25px #ffbd4566;
}

.subtitle{
  letter-spacing:3px;
  font-size:clamp(10px,1.8vw,15px);
  margin:12px 0;
  color:#ffe5ad;
}

.greeting{
  font-size:clamp(22px,4vw,32px);
  margin:10px 0;
  text-shadow:0 0 18px #ffcf5266;
}

.divider{
  width:130px;
  height:2px;
  background:linear-gradient(
    90deg,transparent,#ffe3a0,#d99a31,transparent);
  margin:17px auto;
  box-shadow:0 0 12px #ffc34c66;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin:20px 0;
}

.unit{
  padding:14px 4px;
  border:1px solid #e9bd6370;
  border-radius:12px;
  background:
    linear-gradient(145deg,#8c241d88,#210303c9);
  box-shadow:
    inset 0 0 20px #ffc8570c,
    0 4px 15px #00000033;
}

.num{
  display:block;
  font-family:Arial,sans-serif;
  font-size:clamp(27px,6vw,48px);
  font-weight:700;
  color:#fff0bd;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 15px #ffd77844;
}

.label{
  display:block;
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#f3cb87;
  margin-top:7px;
}

.clock{
  font-family:Arial,sans-serif;
  font-size:14px;
  letter-spacing:1.5px;
  color:#ffe7b4;
}

.footer{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:3px;
  color:#e5b56d;
  margin-top:18px;
}

.spark{
  position:fixed;
  z-index:1;
  color:#ffe39a;
  text-shadow:0 0 15px #ffca48;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
  pointer-events:none;
}
.s1{top:30%;left:12%}
.s2{top:43%;right:12%;animation-delay:1s}
.s3{bottom:24%;left:25%;animation-delay:.5s}
.s4{bottom:30%;right:24%;animation-delay:1.4s}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.8)}
  to{opacity:.9;transform:scale(1.3)}
}

/* Efek partikel emas */
.particle{
  position:fixed;
  z-index:1;
  bottom:-20px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ffdb75;
  box-shadow:0 0 12px 3px #ffb52e88;
  animation:rise linear infinite;
  pointer-events:none;
}

.p1{left:15%;animation-duration:8s}
.p2{left:35%;animation-duration:11s;animation-delay:2s}
.p3{left:65%;animation-duration:9s;animation-delay:1s}
.p4{left:85%;animation-duration:12s;animation-delay:3s}

@keyframes rise{
  0%{transform:translateY(0);opacity:0}
  15%{opacity:.9}
  85%{opacity:.7}
  100%{transform:translateY(-110vh);opacity:0}
}

@media(max-width:480px){
  .page{
    width:94%;
    padding:19px 11px;
    border-radius:18px;
    margin:12px auto;
  }
  .countdown{gap:5px;margin:16px 0}
  .unit{padding:12px 2px}
  .label{font-size:9px;letter-spacing:1px}
  .top{letter-spacing:2px}
  .subtitle{letter-spacing:1.5px}
  .dragon{top:10%;font-size:65px;opacity:.45}
  .dragon-left{left:-17px}
  .dragon-right{right:-17px}
  .lantern-one{left:5%}
  .lantern-two{right:5%}
  .lion{font-size:75px;bottom:0;opacity:.7}
  .lion-left{left:-14px}
  .lion-right{right:-14px}
  .clock{font-size:12px}
  .footer{letter-spacing:2px}
}
@media(max-height:700px){
  .page{padding-top:12px;padding-bottom:12px}
  .lanterns{margin:4px 0}
  .subtitle{margin:8px 0}
  .greeting{margin:6px 0}
  .divider{margin:11px auto}
  .countdown{margin:12px 0}
  .footer{margin-top:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<script>
const target = new Date("2027-02-06T00:00:00+07:00").getTime();
const $ = id => document.getElementById(id);

function update(){
  const now = Date.now();
  const diff = Math.max(0, target - now);

  $("days").textContent =
    String(Math.floor(diff / 86400000)).padStart(3,"0");

  $("hours").textContent =
    String(Math.floor(diff % 86400000 / 3600000)).padStart(2,"0");

  $("minutes").textContent =
    String(Math.floor(diff % 3600000 / 60000)).padStart(2,"0");

  $("seconds").textContent =
    String(Math.floor(diff % 60000 / 1000)).padStart(2,"0");

  $("clock").textContent = new Intl.DateTimeFormat("id-ID",{
    timeZone:"Asia/Jakarta",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(new Date());
}

update();
setInterval(update,1000);
</script>
